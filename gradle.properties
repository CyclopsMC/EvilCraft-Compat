group=org.cyclops.evilcraftcompat
java_version=21

# Common
minecraft_version=1.21.1
mod_name=EvilCraft-Compat
mod_author=rubensworks (aka kroeser)
mod_id=evilcraftcompat
license=MIT
github_url=https://github.com/CyclopsMC/EvilCraft
issue_tracker_url=https://github.com/CyclopsMC/EvilCraft/issues
display_url=https://www.curseforge.com/minecraft/mc-mods/evilcraft
description=EvilCraft compatibility with other mods.

parchment_version=2024.07.07
parchment_minecraft_version=1.21

# NeoForge
neoforge_version=21.1.2
# Only used for compiling and running in dev, the mod itself remains compatible with neoforge_version.
# This is needed because some (dev-only) dependencies such as GeckoLib require a more recent NeoForge version.
neoforge_version_dev=21.1.248
# Version of ASM that neoforge_version_dev ships with, pinned so that it does not clash with the
# older version that NeoForm puts on the classpath of the dev runs.
asm_version=9.10.1
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.caching=true

